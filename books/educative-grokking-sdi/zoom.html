<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zoomable SVG Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f9f9f9;
    }
    #container {
      width: 100%;
      height: 100%;
    }
    .error {
      text-align: center;
      padding-top: 2rem;
      font-family: sans-serif;
      color: #c00;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <!-- Load svg-pan-zoom from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    const container = document.getElementById("container");

    if (!file || !file.endsWith(".svg")) {
      container.innerHTML = "<div class='error'>No valid SVG file specified. Use ?file=your.svg</div>";
    } else {
      fetch(file)
        .then(res => {
          if (!res.ok) throw new Error("SVG not found");
          return res.text();
        })
        .then(svgText => {
          container.innerHTML = svgText;
          const svgElement = container.querySelector("svg");
          if (svgElement) {
            svgElement.removeAttribute("width");
            svgElement.removeAttribute("height");
            svgElement.style.width = "100%";
            svgElement.style.height = "100%";

            svgPanZoom(svgElement, {
              zoomEnabled: true,
              controlIconsEnabled: true,
              fit: true,
              center: true
            });
          } else {
            container.innerHTML = "<div class='error'>Error: File is not a valid SVG.</div>";
          }
        })
        .catch(err => {
          container.innerHTML = `<div class='error'>Failed to load SVG: ${err.message}</div>`;
        });
    }
  </script>
</body>
</html>
